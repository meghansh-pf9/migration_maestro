<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>vjailbreak — Bucket Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:      #121212; --paper:  #1e1e1e; --raised: #2c2c2c;
  --primary: #0089c7; --pri-d:  rgba(0,137,199,.18); --pri-b: rgba(0,137,199,.45);
  --text:    #fff;    --text2:  rgba(255,255,255,.70); --muted: rgba(255,255,255,.42);
  --div:     rgba(255,255,255,.10); --border: rgba(255,255,255,.22);
  --success: #66bb6a; --error: #f44336; --info: #29b6f6; --warning: #ff9800;
  --font: 'Fira Sans', system-ui, sans-serif;
  --mono: 'Fira Code', Consolas, monospace;
}
html,body { height:100%; }
body { background:var(--bg); color:var(--text); font-family:var(--font);
       font-size:14px; line-height:1.6; display:flex; flex-direction:column; height:100vh; overflow:hidden; }

/* Header */
header {
  display:flex; align-items:center; justify-content:space-between;
  padding:0 20px; height:64px;
  background:var(--paper); border-bottom:1px solid var(--div); flex-shrink:0;
}
.brand { display:flex; align-items:center; gap:12px; }
.brand-div { width:1px; height:28px; background:var(--div); }
.brand-text h1 { font-size:15px; font-weight:600; }
.brand-text p  { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-top:1px; }
.nav-links { display:flex; gap:8px; }
.nav-link {
  background:transparent; border:1px solid var(--border); color:var(--text2);
  padding:5px 14px; border-radius:6px; cursor:pointer;
  font:500 13px var(--font); text-decoration:none;
  transition:all .15s; display:inline-flex; align-items:center;
}
.nav-link:hover { border-color:var(--pri-b); color:var(--primary); background:var(--pri-d); }
.nav-link.active { border-color:var(--primary); color:var(--primary); background:var(--pri-d); }

/* Layout */
.main { display:flex; flex:1; overflow:hidden; }

/* Form panel */
.form-panel {
  width:380px; flex-shrink:0;
  background:var(--paper); border-right:1px solid var(--div);
  overflow-y:auto; padding:20px;
  display:flex; flex-direction:column; gap:20px;
}
.form-panel::-webkit-scrollbar { width:5px; }
.form-panel::-webkit-scrollbar-track { background:#2b2b2b; }
.form-panel::-webkit-scrollbar-thumb { background:#6b6b6b; border-radius:3px; }

.section-title {
  font-size:11px; font-weight:600; color:var(--muted);
  text-transform:uppercase; letter-spacing:.08em;
  padding-bottom:8px; border-bottom:1px solid var(--div);
  margin-bottom:12px;
}

.field { display:flex; flex-direction:column; gap:5px; margin-bottom:12px; }
.field label { font-size:12px; font-weight:500; color:var(--text2); }
.field input, .field select {
  background:var(--raised); border:1px solid var(--div);
  border-radius:6px; color:var(--text); padding:7px 10px;
  font:14px var(--font); outline:none; transition:border-color .15s;
  width:100%;
}
.field input:focus, .field select:focus { border-color:var(--pri-b); }
.field select option { background:var(--raised); }

/* Mapping rows */
.mapping-group { display:flex; flex-direction:column; gap:8px; }
.mapping-row {
  display:grid; grid-template-columns:1fr 18px 1fr; align-items:center; gap:6px;
}
.mapping-src {
  background:var(--bg); border:1px solid var(--div); border-radius:5px;
  padding:6px 8px; font:12px var(--mono); color:var(--text2);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.map-arrow { color:var(--muted); text-align:center; font-size:13px; }
.mapping-sel {
  background:var(--raised); border:1px solid var(--div); border-radius:5px;
  color:var(--text); font:13px var(--font); padding:6px 8px; outline:none;
  cursor:pointer; transition:border-color .15s; width:100%;
}
.mapping-sel:focus { border-color:var(--pri-b); }

.loading-mappings {
  font-size:12px; color:var(--muted); padding:8px 0;
  display:flex; align-items:center; gap:6px;
}
.spin {
  width:12px; height:12px; border:2px solid var(--div);
  border-top-color:var(--primary); border-radius:50%;
  animation:spin .8s linear infinite; flex-shrink:0;
}
@keyframes spin { to { transform:rotate(360deg); } }

.error-msg { font-size:12px; color:var(--error); padding:6px 0; }

/* Submit */
#submit-btn {
  width:100%; padding:10px; background:var(--primary); border:none;
  border-radius:8px; color:#fff; font:600 14px var(--font);
  cursor:pointer; transition:background .15s, opacity .15s;
  margin-top:4px;
}
#submit-btn:hover { background:#00a0e8; }
#submit-btn:disabled { opacity:.4; cursor:not-allowed; }

/* Output panel */
.output-panel {
  flex:1; display:flex; flex-direction:column; overflow:hidden;
}
.output-header {
  padding:12px 20px; background:var(--paper); border-bottom:1px solid var(--div);
  font-size:12px; font-weight:600; color:var(--muted);
  text-transform:uppercase; letter-spacing:.08em; flex-shrink:0;
  display:flex; align-items:center; justify-content:space-between;
}
#reset-btn {
  background:transparent; border:1px solid var(--border);
  color:var(--text2); padding:3px 10px; border-radius:5px;
  cursor:pointer; font:500 11px var(--font); transition:all .15s;
  display:none;
}
#reset-btn:hover { border-color:var(--pri-b); color:var(--primary); }
#reset-btn.vis { display:inline-flex; }

.output-body {
  flex:1; overflow-y:auto; padding:20px 24px;
}
.output-body::-webkit-scrollbar { width:5px; }
.output-body::-webkit-scrollbar-track { background:#2b2b2b; }
.output-body::-webkit-scrollbar-thumb { background:#6b6b6b; border-radius:3px; }

/* Empty state */
.empty-state {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  height:100%; color:var(--muted); text-align:center; gap:12px;
}
.empty-icon { font-size:40px; opacity:.4; }
.empty-state h2 { font-size:16px; font-weight:500; color:var(--text2); }
.empty-state p { font-size:13px; max-width:320px; line-height:1.6; }

/* Markdown output */
#md-output { font-size:14px; line-height:1.7; }
#md-output p { margin-bottom:.55em; }
#md-output p:last-child { margin-bottom:0; }
#md-output strong { font-weight:600; }
#md-output h1,#md-output h2,#md-output h3 { font-weight:600; margin:.8em 0 .35em; color:var(--text); }
#md-output h2 { font-size:15px; border-bottom:1px solid var(--div); padding-bottom:6px; }
#md-output h3 { font-size:14px; }
#md-output ul,#md-output ol { padding-left:1.5em; margin-bottom:.5em; }
#md-output li { margin-bottom:.2em; }
#md-output table { border-collapse:collapse; width:100%; margin:.6em 0; font-size:13px; overflow-x:auto; display:block; }
#md-output th,#md-output td { border:1px solid var(--div); padding:6px 10px; text-align:left; white-space:nowrap; }
#md-output th { background:var(--raised); font-weight:600; color:var(--text2); font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
#md-output pre { background:var(--bg); border:1px solid var(--div); border-radius:6px; padding:11px 13px; overflow-x:auto; margin:.5em 0; font-family:var(--mono); font-size:12.5px; line-height:1.5; }
#md-output code { font-family:var(--mono); font-size:12.5px; background:var(--bg); color:var(--info); padding:1px 5px; border-radius:3px; border:1px solid var(--div); }
#md-output pre code { background:transparent; border:none; padding:0; color:var(--text2); }

/* Tool blocks */
.tool-block { margin:6px 0; border:1px solid var(--div); border-radius:6px; overflow:hidden; }
.tool-hdr { display:flex; align-items:center; gap:8px; padding:6px 12px; background:var(--raised); cursor:pointer; user-select:none; transition:background .12s; }
.tool-hdr:hover { background:#333; }
.tool-hdr.has-body { border-bottom:1px solid var(--div); }
.tool-badge { background:var(--pri-d); border:1px solid var(--pri-b); color:var(--primary); font-family:var(--mono); font-size:10px; font-weight:600; padding:1px 7px; border-radius:4px; flex-shrink:0; }
.tool-cmd { color:var(--muted); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-family:var(--mono); font-size:12px; }
.tool-stat { flex-shrink:0; font-size:11px; display:none; }
.tool-stat.ok { display:inline; color:var(--success); }
.tool-chev { color:var(--muted); font-size:10px; transition:transform .18s; flex-shrink:0; display:none; }
.tool-chev.vis { display:inline; }
.tool-chev.open { transform:rotate(90deg); }
.tool-body { background:var(--bg); padding:10px 13px; font-family:var(--mono); font-size:12px; line-height:1.5; white-space:pre-wrap; word-break:break-word; color:var(--text2); max-height:200px; overflow-y:auto; display:none; }
.tool-body.open { display:block; }

/* Thinking */
.thinking { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:13px; padding:4px 0; }
.dots { display:inline-flex; gap:4px; }
.dots span { width:5px; height:5px; border-radius:50%; background:var(--primary); opacity:.4; animation:pulse 1.2s ease-in-out infinite; }
.dots span:nth-child(2){animation-delay:.2s} .dots span:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,80%,100%{opacity:.15;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
</style>
</head>

</header>

<div class="main">

  <!-- Form panel -->
  <div class="form-panel">

    <div>
      <div class="section-title">Network Mappings</div>
      <div class="mapping-group" id="net-mappings">
        <div class="loading-mappings"><div class="spin"></div> Fetching inventory…</div>
      </div>
    </div>

    <div>
      <div class="section-title">Storage Mappings</div>
      <div class="mapping-group" id="stor-mappings">
        <div class="loading-mappings"><div class="spin"></div> Fetching inventory…</div>
      </div>
    </div>

    <div>
      <div class="section-title">Agent Sizing</div>
      <div class="field">
        <label>Agent Flavor vCPUs
          <span id="vcpu-badge" style="margin-left:6px;font-size:10px;background:rgba(0,137,199,.18);border:1px solid rgba(0,137,199,.4);color:#0089c7;padding:1px 6px;border-radius:3px;display:none">auto-detected</span>
        </label>
        <input type="number" id="agent-vcpus" value="8" min="1" placeholder="auto-detecting…"/>
      </div>
      <div class="field">
        <label>Max Agents</label>
        <input type="number" id="agent-max" value="10" min="1"/>
      </div>
    </div>

    <button id="submit-btn" onclick="runPlan()" disabled>
      Generate Bucket Plan
    </button>

  </div>

  <!-- Output panel -->
  <div class="output-panel">
    <div class="output-header">
      <span>Bucket Plan</span>
      <button id="reset-btn" onclick="resetPlan()">↺ Reset</button>
    </div>
    <div class="output-body" id="output-body">
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">🗂</div>
        <h2>No plan generated yet</h2>
        <p>Fill in the network and storage mappings on the left, then click <strong>Generate Bucket Plan</strong>.</p>
      </div>
      <div id="tool-area"></div>
      <div class="thinking" id="thinking" style="display:none">
        <div class="dots"><span></span><span></span><span></span></div>
        <span id="thinking-label">Fetching inventory…</span>
      </div>
      <div id="md-output"></div>
    </div>
  </div>

</div>

<script>
marked.setOptions({ breaks: true, gfm: true });

const sessionId = crypto.randomUUID();
let isRunning   = false;
let invData     = null;

// ── Load inventory on page load ─────────────────────────────────────────────
async function loadInventory() {
  try {
    const res = await fetch('/inventory-data');
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    invData = data;
    renderMappings(data);
    document.getElementById('submit-btn').disabled = false;
  } catch (e) {
    document.getElementById('net-mappings').innerHTML =
      `<div class="error-msg">⚠ Could not reach cluster: ${e.message}</div>`;
    document.getElementById('stor-mappings').innerHTML = '';
    // Still allow submit with empty mappings
    document.getElementById('submit-btn').disabled = false;
  }
}

function renderMappings(data) {
  // Auto-detected agent vCPUs
  if (data.agent_vcpus) {
    document.getElementById('agent-vcpus').value = data.agent_vcpus;
    document.getElementById('vcpu-badge').style.display = 'inline';
  }

  // Network mappings
  const netEl = document.getElementById('net-mappings');
  if (!data.source_networks.length) {
    netEl.innerHTML = '<div class="loading-mappings" style="animation:none">No source networks found</div>';
  } else {
    netEl.innerHTML = data.source_networks.map(src => `
      <div class="mapping-row">
        <div class="mapping-src" title="${esc(src)}">${esc(src)}</div>
        <div class="map-arrow">→</div>
        <select class="mapping-sel" data-type="net" data-src="${esc(src)}">
          ${data.target_networks.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('')}
        </select>
      </div>`).join('');
  }

  // Storage mappings
  const storEl = document.getElementById('stor-mappings');
  if (!data.source_datastores.length) {
    storEl.innerHTML = '<div class="loading-mappings" style="animation:none">No source datastores found</div>';
  } else {
    storEl.innerHTML = data.source_datastores.map(src => `
      <div class="mapping-row">
        <div class="mapping-src" title="${esc(src)}">${esc(src)}</div>
        <div class="map-arrow">→</div>
        <select class="mapping-sel" data-type="stor" data-src="${esc(src)}">
          ${data.target_volumes.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('')}
        </select>
      </div>`).join('');
  }
}

// ── Build prompt from form ───────────────────────────────────────────────────
function buildPrompt() {
  const agentCPUs = document.getElementById('agent-vcpus').value;
  const agentMax  = document.getElementById('agent-max').value;

  const netMaps = [...document.querySelectorAll('.mapping-sel[data-type="net"]')]
    .map(s => `  - ${s.dataset.src} → ${s.value}`).join('\n') || '  (none)';
  const storMaps = [...document.querySelectorAll('.mapping-sel[data-type="stor"]')]
    .map(s => `  - ${s.dataset.src} → ${s.value}`).join('\n') || '  (none)';

  return `Create a mock migration bucket plan using these settings:

NETWORK MAPPINGS:
${netMaps}

STORAGE MAPPINGS:
${storMaps}

AGENT SETTINGS:
  - Agent flavor vCPUs: ${agentCPUs}
  - Max agents: ${agentMax}

Apply the full bucket creation ruleset, fetch the live VMwareMachine inventory,
and output the complete bucket plan with summary table, per-bucket VM details,
agent suggestion with bottleneck explanation, and flagged VMs list.
No destination cluster is needed — omit it from the bucket config.`;
}

// ── Run plan ─────────────────────────────────────────────────────────────────
async function runPlan() {
  if (isRunning) return;
  isRunning = true;
  document.getElementById('submit-btn').disabled = true;

  // Reset output
  document.getElementById('empty-state').style.display  = 'none';
  document.getElementById('tool-area').innerHTML         = '';
  document.getElementById('md-output').innerHTML         = '';
  document.getElementById('thinking').style.display      = 'flex';
  document.getElementById('thinking-label').textContent  = 'Fetching inventory…';
  document.getElementById('reset-btn').classList.remove('vis');

  const prompt = buildPrompt();
  let mdBuf = '';

  try {
    const res = await fetch('/bucket-chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: prompt, session_id: sessionId }),
    });

    const reader = res.body.getReader();
    const dec    = new TextDecoder();
    let buf = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        let e; try { e = JSON.parse(line.slice(6)); } catch { continue; }

        if (e.type === 'text') {
          document.getElementById('thinking').style.display = 'none';
          mdBuf += e.content;
          document.getElementById('md-output').innerHTML = marked.parse(mdBuf);
          scrollOutput();
        } else if (e.type === 'tool_start') {
          updateThinking(`Running ${e.name}…`);
          addToolBlock(e.id, e.name);
        } else if (e.type === 'tool_call') {
          setToolCmd(e.id, e.command);
        } else if (e.type === 'tool_result') {
          setToolResult(e.id, e.content);
          updateThinking('Processing results…');
        } else if (e.type === 'error') {
          document.getElementById('thinking').style.display = 'none';
          document.getElementById('md-output').innerHTML +=
            `<p style="color:var(--error)">⚠ Error: ${esc(e.content)}</p>`;
        } else if (e.type === 'done') {
          document.getElementById('thinking').style.display = 'none';
          document.getElementById('reset-btn').classList.add('vis');
        }
      }
    }
  } catch (err) {
    document.getElementById('thinking').style.display = 'none';
    document.getElementById('md-output').innerHTML +=
      `<p style="color:var(--error)">⚠ Connection error: ${esc(err.message)}</p>`;
  } finally {
    isRunning = false;
    document.getElementById('submit-btn').disabled = false;
  }
}

// ── Reset ─────────────────────────────────────────────────────────────────────
async function resetPlan() {
  await fetch(`/bucket-session/${sessionId}`, { method: 'DELETE' }).catch(() => {});
  document.getElementById('tool-area').innerHTML   = '';
  document.getElementById('md-output').innerHTML   = '';
  document.getElementById('empty-state').style.display = 'flex';
  document.getElementById('reset-btn').classList.remove('vis');
}

// ── Tool block helpers ────────────────────────────────────────────────────────
function addToolBlock(id, name) {
  const area = document.getElementById('tool-area');
  const blk  = document.createElement('div');
  blk.className = 'tool-block';
  blk.innerHTML = `
    <div class="tool-hdr" onclick="toggleTool(this)">
      <span class="tool-badge">${esc(name)}</span>
      <span class="tool-cmd" id="tc-${id}">running…</span>
      <span class="tool-stat" id="ts-${id}">✓</span>
      <span class="tool-chev" id="tv-${id}">▶</span>
    </div>
    <div class="tool-body" id="tb-${id}"></div>`;
  area.appendChild(blk);
  scrollOutput();
}
function setToolCmd(id, cmd) {
  const c = document.getElementById(`tc-${id}`);
  const b = document.getElementById(`tb-${id}`);
  if (c) c.textContent = '$ ' + cmd;
  if (b) b.textContent = '$ ' + cmd + '\n';
}
function setToolResult(id, content) {
  const b = document.getElementById(`tb-${id}`);
  if (b) b.textContent += content;
  document.getElementById(`ts-${id}`)?.classList.add('ok');
  document.getElementById(`tv-${id}`)?.classList.add('vis');
  document.getElementById(`tc-${id}`)?.closest('.tool-hdr')?.classList.add('has-body');
  scrollOutput();
}
function toggleTool(hdr) {
  const body = hdr.nextElementSibling;
  const chev = hdr.querySelector('.tool-chev');
  if (!body.textContent.trim() && !body.classList.contains('open')) return;
  body.classList.toggle('open');
  chev?.classList.toggle('open');
}

function updateThinking(msg) {
  document.getElementById('thinking').style.display = 'flex';
  document.getElementById('thinking-label').textContent = msg;
}
function scrollOutput() {
  const b = document.getElementById('output-body');
  b.scrollTop = b.scrollHeight;
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                  .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

window.addEventListener('DOMContentLoaded', loadInventory);
</script>
</body>
</html>
